<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --room-h: #2F5496;
    --room-a: #4472C4;
    --room-light: #dce6f1;
    --zoom-h: #375623;
    --zoom-a: #548235;
    --zoom-light: #d9ead3;
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #d8dce3;
    --text: #1a1d23;
    --muted: #6b7280;
    --radius: 10px;
  }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
  }

  header {
    max-width: 1100px;
    margin: 0 auto 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .logo span { color: var(--room-a); }
  .subtitle { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 4px; }

  .export-btn {
    background: var(--text);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: var(--radius);
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity .2s;
  }
  .export-btn:hover { opacity: .8; }

  .tabs {
    max-width: 1100px;
    margin: 0 auto 0;
    display: flex;
    gap: 4px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 0;
  }

  .tab {
    padding: 10px 24px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    border: 2px solid transparent;
    border-bottom: none;
    color: var(--muted);
    background: transparent;
    transition: all .2s;
    position: relative;
    bottom: -2px;
  }
  .tab.active[data-tab="room"] { color: var(--room-h); background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); }
  .tab.active[data-tab="zoom"] { color: var(--zoom-h); background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); }
  .tab:hover:not(.active) { color: var(--text); }

  .panel {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--surface);
    border: 2px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
    display: none;
  }
  .panel.active { display: block; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
  }
  #room-panel .badge { background: var(--room-light); color: var(--room-h); }
  #zoom-panel .badge { background: var(--zoom-light); color: var(--zoom-h); }

  .new-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .new-btn:active { transform: scale(.97); }
  #room-panel .new-btn { background: var(--room-a); color: #fff; box-shadow: 0 2px 8px rgba(68,114,196,.35); }
  #room-panel .new-btn:hover { box-shadow: 0 4px 16px rgba(68,114,196,.45); }
  #zoom-panel .new-btn { background: var(--zoom-a); color: #fff; box-shadow: 0 2px 8px rgba(84,130,53,.35); }
  #zoom-panel .new-btn:hover { box-shadow: 0 4px 16px rgba(84,130,53,.45); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead tr {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #fff;
  }
  #room-panel thead tr { background: var(--room-a); }
  #zoom-panel thead tr { background: var(--zoom-a); }

  th { padding: 12px 16px; text-align: left; font-weight: 500; }
  th:first-child, td:first-child { width: 56px; text-align: center; }
  th:last-child, td:last-child { width: 80px; text-align: center; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  tbody tr:nth-child(even) { background: #f8f9fb; }
  tbody tr:hover { background: #eef2ff; }
  tbody tr.editing { background: #fffbeb !important; }

  td { padding: 11px 16px; vertical-align: middle; }
  td.no { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }

  td input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
    background: #fff;
  }
  td input:focus { border-color: var(--room-a); }
  #zoom-panel td input:focus { border-color: var(--zoom-a); }

  .action-btns { display: flex; gap: 6px; justify-content: center; }

  .icon-btn {
    width: 28px; height: 28px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all .15s;
  }
  .save-btn { background: #d1fae5; color: #065f46; }
  .save-btn:hover { background: #6ee7b7; }
  .del-btn { background: #fee2e2; color: #991b1b; }
  .del-btn:hover { background: #fca5a5; }
  .edit-btn { background: #e0e7ff; color: #3730a3; }
  .edit-btn:hover { background: #a5b4fc; }

  .empty-row td {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 32px;
    font-style: italic;
  }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 16px;
    width: 420px;
    max-width: 95vw;
    box-shadow: 0 24px 80px rgba(0,0,0,.25);
    overflow: hidden;
    animation: modalIn .2s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-head {
    padding: 20px 24px 16px;
    font-size: 17px;
    font-weight: 800;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-head .dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }

  .field label {
    display: block;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }

  .modal-foot {
    padding: 16px 24px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    border-top: 1px solid var(--border);
  }

  .btn-cancel {
    padding: 9px 18px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-cancel:hover { background: var(--border); }

  .btn-add {
    padding: 9px 20px;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    color: #fff;
    transition: opacity .2s;
  }
  .btn-add:hover { opacity: .85; }

  .count-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 20px;
    margin-left: 6px;
    font-weight: 500;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Booking <span>Manager</span></div>
    <div class="subtitle">// conference room & zoom call scheduler</div>
  </div>
  <button class="export-btn" onclick="exportExcel()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Export Excel
  </button>
</header>

<div class="tabs">
  <button class="tab active" data-tab="room" onclick="switchTab('room')">📋 Conference Room</button>
  <button class="tab" data-tab="zoom" onclick="switchTab('zoom')">💻 Zoom Call</button>
</div>

<!-- Room Panel -->
<div class="panel active" id="room-panel">
  <div class="panel-header">
    <div class="panel-title">
      Conference Room Booking
      <span class="badge" id="room-count">0 records</span>
    </div>
    <button class="new-btn" onclick="openModal('room')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New
    </button>
  </div>
  <table>
    <thead>
      <tr>
        <th>No.</th>
        <th>Staff Name</th>
        <th>Date &amp; Start Time</th>
        <th>Date &amp; End Time</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="room-tbody"></tbody>
  </table>
</div>

<!-- Zoom Panel -->
<div class="panel" id="zoom-panel">
  <div class="panel-header">
    <div class="panel-title">
      Zoom Call Booking
      <span class="badge" id="zoom-count">0 records</span>
    </div>
    <button class="new-btn" onclick="openModal('zoom')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New
    </button>
  </div>
  <table>
    <thead>
      <tr>
        <th>No.</th>
        <th>Staff Name</th>
        <th>Date &amp; Start Time</th>
        <th>Date &amp; End Time</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="zoom-tbody"></tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div class="dot" id="modal-dot"></div>
      <span id="modal-title">New Booking</span>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Staff Name</label>
        <input type="text" id="f-name" placeholder="e.g. Alice Johnson" />
      </div>
      <div class="field">
        <label>Date &amp; Start Time</label>
        <input type="datetime-local" id="f-start" />
      </div>
      <div class="field">
        <label>Date &amp; End Time</label>
        <input type="datetime-local" id="f-end" />
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-add" id="modal-add-btn" onclick="addRecord()">Add Record</button>
    </div>
  </div>
</div>

<script>
const data = {
  room: [
    { name: 'Alice Johnson',  start: '2026-03-10T09:00', end: '2026-03-10T10:00' },
    { name: 'Bob Martinez',   start: '2026-03-10T10:30', end: '2026-03-10T12:00' },
    { name: 'Carol Lee',      start: '2026-03-10T13:00', end: '2026-03-10T14:00' },
    { name: 'David Kim',      start: '2026-03-11T09:00', end: '2026-03-11T10:30' },
    { name: 'Eva Nguyen',     start: '2026-03-11T11:00', end: '2026-03-11T12:00' },
    { name: 'Frank Chen',     start: '2026-03-11T14:00', end: '2026-03-11T15:30' },
    { name: 'Grace Patel',    start: '2026-03-12T09:30', end: '2026-03-12T11:00' },
    { name: 'Henry Brown',    start: '2026-03-12T13:00', end: '2026-03-12T14:00' },
    { name: 'Irene Walsh',    start: '2026-03-12T15:00', end: '2026-03-12T16:00' },
    { name: 'James Park',     start: '2026-03-13T10:00', end: '2026-03-13T11:30' },
  ],
  zoom: [
    { name: 'Alice Johnson',  start: '2026-03-10T08:30', end: '2026-03-10T09:00' },
    { name: 'Bob Martinez',   start: '2026-03-10T11:00', end: '2026-03-10T11:45' },
    { name: 'Carol Lee',      start: '2026-03-10T14:00', end: '2026-03-10T15:00' },
    { name: 'David Kim',      start: '2026-03-11T08:00', end: '2026-03-11T09:00' },
    { name: 'Eva Nguyen',     start: '2026-03-11T10:00', end: '2026-03-11T10:30' },
    { name: 'Frank Chen',     start: '2026-03-11T13:00', end: '2026-03-11T14:00' },
    { name: 'Grace Patel',    start: '2026-03-12T08:00', end: '2026-03-12T09:30' },
    { name: 'Henry Brown',    start: '2026-03-12T11:00', end: '2026-03-12T12:00' },
    { name: 'Irene Walsh',    start: '2026-03-12T14:30', end: '2026-03-12T15:30' },
    { name: 'James Park',     start: '2026-03-13T09:00', end: '2026-03-13T10:00' },
  ]
};

let activeTab = 'room';
let editingIdx = null;

function fmt(dtStr) {
  if (!dtStr) return '';
  const d = new Date(dtStr);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
}

function render(type) {
  const tbody = document.getElementById(`${type}-tbody`);
  const rows = data[type];
  tbody.innerHTML = '';
  if (rows.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="5">No bookings yet. Click <strong>New</strong> to add one.</td></tr>`;
  } else {
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="no">${i+1}</td>
        <td>${r.name}</td>
        <td>${fmt(r.start)}</td>
        <td>${fmt(r.end)}</td>
        <td>
          <div class="action-btns">
            <button class="icon-btn edit-btn" title="Edit" onclick="startEdit('${type}',${i})">✏️</button>
            <button class="icon-btn del-btn" title="Delete" onclick="deleteRow('${type}',${i})">🗑️</button>
          </div>
        </td>`;
      tbody.appendChild(tr);
    });
  }
  const count = rows.length;
  document.getElementById(`${type}-count`).textContent = `${count} record${count !== 1 ? 's' : ''}`;
}

function startEdit(type, idx) {
  const r = data[type][idx];
  const tbody = document.getElementById(`${type}-tbody`);
  const tr = tbody.rows[idx];
  tr.classList.add('editing');
  tr.innerHTML = `
    <td class="no">${idx+1}</td>
    <td><input type="text" value="${r.name}" id="e-name"/></td>
    <td><input type="datetime-local" value="${r.start}" id="e-start"/></td>
    <td><input type="datetime-local" value="${r.end}" id="e-end"/></td>
    <td>
      <div class="action-btns">
        <button class="icon-btn save-btn" title="Save" onclick="saveEdit('${type}',${idx})">✅</button>
        <button class="icon-btn del-btn" title="Cancel" onclick="render('${type}')">✖️</button>
      </div>
    </td>`;
}

function saveEdit(type, idx) {
  const name = document.getElementById('e-name').value.trim();
  const start = document.getElementById('e-start').value;
  const end = document.getElementById('e-end').value;
  if (!name || !start || !end) { alert('Please fill all fields.'); return; }
  data[type][idx] = { name, start, end };
  render(type);
}

function deleteRow(type, idx) {
  if (!confirm('Delete this booking?')) return;
  data[type].splice(idx, 1);
  render(type);
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `${tab}-panel`));
}

function openModal(type) {
  activeTab = type;
  const colors = { room: '#4472C4', zoom: '#548235' };
  document.getElementById('modal-dot').style.background = colors[type];
  document.getElementById('modal-title').textContent = type === 'room' ? 'New Room Booking' : 'New Zoom Booking';
  document.getElementById('modal-add-btn').style.background = colors[type];
  document.getElementById('f-name').value = '';
  document.getElementById('f-start').value = '';
  document.getElementById('f-end').value = '';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function addRecord() {
  const name = document.getElementById('f-name').value.trim();
  const start = document.getElementById('f-start').value;
  const end = document.getElementById('f-end').value;
  if (!name) { alert('Please enter a staff name.'); return; }
  if (!start) { alert('Please enter a start time.'); return; }
  if (!end) { alert('Please enter an end time.'); return; }
  if (end <= start) { alert('End time must be after start time.'); return; }
  data[activeTab].push({ name, start, end });
  render(activeTab);
  closeModal();
}

function exportExcel() {
  const wb = XLSX.utils.book_new();
  ['room','zoom'].forEach(type => {
    const rows = [['No.','Staff Name','Date & Start Time','Date & End Time']];
    data[type].forEach((r,i) => rows.push([i+1, r.name, fmt(r.start), fmt(r.end)]));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:6},{wch:22},{wch:22},{wch:22}];
    XLSX.utils.book_append_sheet(wb, ws, type === 'room' ? 'Conference Room Booking' : 'Zoom Call Booking');
  });
  XLSX.writeFile(wb, 'Room_Zoom_Booking.xlsx');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modal').classList.contains('open')) addRecord();
});

render('room');
render('zoom');
</script>
</body>
</html>
