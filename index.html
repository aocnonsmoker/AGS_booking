<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGS</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --room-h: #2F5496;
    --room-a: #4472C4;
    --room-light: #dce6f1;
    --zoom-h: #375623;
    --zoom-a: #548235;
    --zoom-light: #d9ead3;
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #d8dce3;
    --text: #1a1d23;
    --muted: #6b7280;
    --radius: 10px;
  }

  body {
    font-family: 'Roboto', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
  }

  header {
    max-width: 1100px;
    margin: 0 auto 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo { height: 100px; width: auto; display: block; }
  .subtitle { font-family: 'Roboto', sans-serif; font-size: 12px; color: var(--muted); margin-top: 4px; }


  .tabs {
    max-width: 1100px;
    margin: 0 auto 0;
    display: flex;
    gap: 4px;
    border-bottom: 2px solid var(--border);
  }

  .tab {
    padding: 10px 24px;
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    border: 2px solid transparent;
    border-bottom: none;
    color: var(--muted);
    background: transparent;
    transition: all .2s;
    position: relative;
    bottom: -2px;
  }
  .tab.active[data-tab="room"] { color: var(--room-h); background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); }
  .tab.active[data-tab="zoom"] { color: var(--zoom-h); background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); }
  .tab:hover:not(.active) { color: var(--text); }

  .panel {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--surface);
    border: 2px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
    display: none;
  }
  .panel.active { display: block; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

  .badge { font-family: 'Roboto', sans-serif; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
  #room-panel .badge { background: var(--room-light); color: var(--room-h); }
  #zoom-panel .badge { background: var(--zoom-light); color: var(--zoom-h); }

  .panel-actions { display: flex; gap: 8px; align-items: center; }

  .refresh-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 14px; border: 1.5px solid var(--border);
    border-radius: 8px; font-family: 'Roboto', sans-serif;
    font-weight: 600; font-size: 12px; cursor: pointer;
    background: #fff; color: var(--muted); transition: all .2s;
  }
  .refresh-btn:hover { border-color: var(--text); color: var(--text); }
  .refresh-btn.spinning svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .new-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px; border: none; border-radius: 8px;
    font-family: 'Roboto', sans-serif; font-weight: 700;
    font-size: 13px; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .new-btn:active { transform: scale(.97); }
  #room-panel .new-btn { background: var(--room-a); color: #fff; box-shadow: 0 2px 8px rgba(68,114,196,.35); }
  #room-panel .new-btn:hover { box-shadow: 0 4px 16px rgba(68,114,196,.45); }
  #zoom-panel .new-btn { background: var(--zoom-a); color: #fff; box-shadow: 0 2px 8px rgba(84,130,53,.35); }
  #zoom-panel .new-btn:hover { box-shadow: 0 4px 16px rgba(84,130,53,.45); }

  .zoom-link-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 6px; border: 1.5px solid var(--zoom-a);
    font-family: 'Roboto', sans-serif; font-weight: 600; font-size: 11px;
    color: var(--zoom-a); background: var(--zoom-light); cursor: pointer; transition: all .15s;
  }
  .zoom-link-btn:hover { background: var(--zoom-a); color: #fff; }
  .zoom-link-btn.copied { background: var(--zoom-a); color: #fff; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { font-size: 11px; font-family: 'Roboto', sans-serif; text-transform: uppercase; letter-spacing: .06em; color: #fff; }
  #room-panel thead tr { background: var(--room-a); }
  #zoom-panel thead tr { background: var(--zoom-a); }
  th { padding: 12px 16px; text-align: left; font-weight: 500; }
  th:first-child, td:first-child { width: 56px; text-align: center; }

  tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
  tbody tr:nth-child(even) { background: #f8f9fb; }
  tbody tr:hover { background: #eef2ff; }
  td { padding: 11px 16px; vertical-align: middle; }
  td.no { font-family: 'Roboto', sans-serif; font-size: 12px; color: var(--muted); }

  .action-btns { display: flex; gap: 6px; }
  .btn-edit, .btn-remove {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 6px; border: 1.5px solid;
    font-family: 'Roboto', sans-serif; font-weight: 600; font-size: 11px;
    cursor: pointer; transition: all .15s;
  }
  .btn-edit { background: #f0f4ff; color: #4472c4; border-color: #c5d3f5; }
  .btn-edit:hover { background: #4472c4; color: #fff; border-color: #4472c4; }
  .btn-remove { background: #fff2f2; color: #d94f4f; border-color: #f5c5c5; }
  .btn-remove:hover { background: #d94f4f; color: #fff; border-color: #d94f4f; }

  .empty-row td, .loading-row td {
    text-align: center; color: var(--muted);
    font-size: 13px; padding: 40px; font-style: italic;
  }

  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 2px solid var(--border); border-top-color: var(--room-a);
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }

  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); backdrop-filter: blur(4px);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: #fff; border-radius: 16px; width: 420px;
    max-width: 95vw; box-shadow: 0 24px 80px rgba(0,0,0,.25);
    overflow: hidden; animation: modalIn .2s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-head {
    padding: 20px 24px 16px; font-size: 17px; font-weight: 800;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .modal-head .dot { width: 10px; height: 10px; border-radius: 50%; }
  .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }

  .field label {
    display: block; font-size: 11px; font-family: 'Roboto', sans-serif;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 5px;
  }
  .field input {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-family: 'Roboto', sans-serif; font-size: 14px;
    outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: var(--room-a); }

  .modal-foot {
    padding: 16px 24px; display: flex; gap: 10px;
    justify-content: flex-end; border-top: 1px solid var(--border);
  }

  .btn-cancel {
    padding: 9px 18px; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 8px;
    font-family: 'Roboto', sans-serif; font-weight: 600;
    font-size: 13px; cursor: pointer; transition: background .15s;
  }
  .btn-cancel:hover { background: var(--border); }

  .btn-add {
    padding: 9px 20px; border: none; border-radius: 8px;
    font-family: 'Roboto', sans-serif; font-weight: 700;
    font-size: 13px; cursor: pointer; color: #fff;
    transition: opacity .2s; display: flex; align-items: center; gap: 8px;
  }
  .btn-add:hover { opacity: .85; }
  .btn-add:disabled { opacity: .5; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 20px; border-radius: 10px;
    font-family: 'Roboto', sans-serif; font-weight: 600; font-size: 13px;
    color: #fff; z-index: 999; opacity: 0; transform: translateY(10px);
    transition: all .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: #059669; }
  .toast.error { background: #dc2626; }

  /* ── Tablet (≤768px) ─────────────────────────────────────── */
  @media (max-width: 768px) {
    body { padding: 20px 16px; }

    header { margin-bottom: 20px; }
    .logo { height: 70px; }

    .tab { padding: 8px 14px; font-size: 12px; }

    .panel-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
    }
    .panel-actions { width: 100%; justify-content: flex-end; }

    th { padding: 10px 12px; }
    td { padding: 9px 12px; }
    th:first-child, td:first-child { width: 36px; }

    .action-btns { flex-direction: column; gap: 4px; }
    .btn-edit, .btn-remove { font-size: 10px; padding: 4px 8px; }

    .modal { width: 95vw; }
  }

  /* ── Mobile (≤480px) ─────────────────────────────────────── */
  @media (max-width: 480px) {
    body { padding: 12px 10px; }

    .logo { height: 50px; }

    .tabs { gap: 2px; }
    .tab { padding: 7px 10px; font-size: 11px; }

    .panel-title { font-size: 13px; flex-wrap: wrap; gap: 6px; }
    .badge { font-size: 10px; }

    .refresh-btn { padding: 7px 10px; font-size: 11px; }
    .new-btn { padding: 7px 12px; font-size: 12px; }
    .zoom-link-btn { font-size: 10px; padding: 4px 8px; }

    table { font-size: 11px; }
    th { padding: 8px 6px; font-size: 10px; }
    td { padding: 8px 6px; }
    th:first-child, td:first-child { width: 28px; }
    .action-btns { flex-wrap: wrap; }

    .modal { border-radius: 12px; }
    .modal-head { font-size: 15px; padding: 16px 18px 12px; }
    .modal-body { padding: 16px 18px; }
    .modal-foot { padding: 12px 18px; }

    .toast { bottom: 12px; right: 12px; left: 12px; text-align: center; }
  }

  /* ── Very small (≤375px) ─────────────────────────────────── */
  @media (max-width: 375px) {
    th:first-child, td:first-child { display: none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <img src="img/AGS_logo.png" alt="AGS Logo" class="logo">
  </div>
</header>


<div class="tabs">
  <button class="tab active" data-tab="room" onclick="switchTab('room')">📋 Зал переговорной</button>
  <button class="tab" data-tab="zoom" onclick="switchTab('zoom')">💻 Zoom конференция</button>
</div>

<div class="panel active" id="room-panel">
  <div class="panel-header">
    <div class="panel-title">
      <span class="badge" id="room-count">0 записей</span>
    </div>
    <div class="panel-actions">
      <button class="refresh-btn" onclick="loadRecords()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Обновить
      </button>
      <button class="new-btn" onclick="openModal('room')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Добавить
      </button>
    </div>
  </div>
  <table>
    <thead><tr><th>No.</th><th><strong>ФИО сотрудника</strong></th><th><strong>Дата и время начала</strong></th><th><strong>Дата и время окончания</strong></th><th><strong>Действие</strong></th></tr></thead>
    <tbody id="room-tbody"><tr class="loading-row"><td colspan="5"><span class="spinner"></span>Загрузка...</td></tr></tbody>
  </table>
</div>

<div class="panel" id="zoom-panel">
  <div class="panel-header">
    <div class="panel-title">
      <span class="badge" id="zoom-count">0 записей</span>
      <button class="zoom-link-btn" onclick="copyZoomLink(this)" title="Скопировать ссылку Zoom">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Zoom ссылка
      </button>
    </div>
    <div class="panel-actions">
      <button class="refresh-btn" onclick="loadRecords()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Обновить
      </button>
      <button class="new-btn" onclick="openModal('zoom')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Добавить
      </button>
    </div>
  </div>
  <table>
    <thead><tr><th>No.</th><th><strong>ФИО сотрудника</strong></th><th><strong>Дата и время начала</strong></th><th><strong>Дата и время окончания</strong></th><th><strong>Действие</strong></th></tr></thead>
    <tbody id="zoom-tbody"><tr class="loading-row"><td colspan="5"><span class="spinner"></span>Загрузка...</td></tr></tbody>
  </table>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div class="dot" id="modal-dot"></div>
      <span id="modal-title">Новая запись</span>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>ФИО сотрудника</label>
        <input type="text" id="f-name" placeholder="например Канат Маратов" />
      </div>
      <div class="field">
        <label>Дата и время начала</label>
        <input type="datetime-local" id="f-start" />
      </div>
      <div class="field">
        <label>Дата и время окончания</label>
        <input type="datetime-local" id="f-end" />
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">Отменить</button>
      <button class="btn-add" id="modal-add-btn" onclick="addRecord()">
        <span id="btn-label">Добавить запись</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtQpNAzOTUPfDp32vQyOHUgJn_o8gdkxHli1cR0GcmpdUumrKpv9AfqS84NyhvFVeilg/exec';
let activeTab = 'room';
let allRecords = [];
let editingRecord = null;

function toDatetimeLocal(val) {
  if (!val) return '';
  const d = new Date(val);
  if (isNaN(d)) return '';
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}T${hh}:${min}`;
}

function fmt(val) {
  if (!val) return '—';
  const d = new Date(val);
  if (isNaN(d)) return val;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
}

function renderTable(type) {
  const tbody = document.getElementById(`${type}-tbody`);
  const label = type === 'room' ? 'Conference Room Booking' : 'Zoom Call Booking';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const rows = allRecords
    .filter(r => r['Sheet'] == (type === 'room' ? 1 : 2) || r['Sheet'] === String(type === 'room' ? 1 : 2))
    .filter(r => new Date(r['Date & Start Time'] || r['Start Time']) >= today)
    .sort((a, b) => new Date(a['Date & Start Time'] || a['Start Time']) - new Date(b['Date & Start Time'] || b['Start Time']));
  tbody.innerHTML = '';
  if (rows.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="5">Еще нет записей. Нажмите <strong>Добавить</strong></td></tr>`;
  } else {
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="no">${i+1}</td>
        <td data-label="ФИО сотрудника">${r['Staff Name'] || '—'}</td>
        <td data-label="Начало">${fmt(r['Date & Start Time'] || r['Start Time'])}</td>
        <td data-label="Окончание">${fmt(r['Date & End Time'] || r['End Time'])}</td>
        <td data-label="Действие">
          <div class="action-btns">
            <button class="btn-edit" onclick="editRecord(${i}, '${type}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Изменить
            </button>
            <button class="btn-remove" onclick="removeRecord(${i}, '${type}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              Удалить
            </button>
          </div>
        </td>`;
      tbody.appendChild(tr);
    });
  }
  const count = rows.length;
  document.getElementById(`${type}-count`).textContent = `${count} запис${count > 4 ? 'ей' : count === 1 ? 'ь' : 'и'}`;
}

async function loadRecords() {
  if (!SCRIPT_URL) return;
  document.querySelectorAll('.refresh-btn').forEach(b => b.classList.add('spinning'));
  ['room','zoom'].forEach(t => {
    document.getElementById(`${t}-tbody`).innerHTML =
      `<tr class="loading-row"><td colspan="5"><span class="spinner"></span>Загрузка...</td></tr>`;
  });
  try {
    const res = await fetch(SCRIPT_URL);
    const json = await res.json();
    if (json.status === 'success') {
      allRecords = json.data;
      renderTable('room');
      renderTable('zoom');
    } else throw new Error(json.message);
  } catch {
    ['room','zoom'].forEach(t => {
      document.getElementById(`${t}-tbody`).innerHTML =
        `<tr class="loading-row"><td colspan="5">❌ Не удалось загрузить записи. Попробуйте позже.</td></tr>`;
    });
    showToast('Не удалось загрузить записи', 'error');
  }
  document.querySelectorAll('.refresh-btn').forEach(b => b.classList.remove('spinning'));
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `${tab}-panel`));
}

function openModal(type) {
  activeTab = type;
  const colors = { room: '#4472C4', zoom: '#548235' };
  document.getElementById('modal-dot').style.background = colors[type];
  document.getElementById('modal-title').textContent = type === 'room' ? 'Зал переговорной' : 'Zoom конференция';
  document.getElementById('modal-add-btn').style.background = colors[type];
  editingRecord = null;
  document.getElementById('f-name').value = '';
  document.getElementById('f-start').value = '';
  document.getElementById('f-end').value = '';
  document.getElementById('btn-label').textContent = 'Записать';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); editingRecord = null; }

async function addRecord() {
  const name = document.getElementById('f-name').value.trim();
  const start = document.getElementById('f-start').value;
  const end = document.getElementById('f-end').value;
  if (!name)  { showToast('Пожалуйста заполните имя', 'error'); return; }
  if (!start) { showToast('Пожалуйста заполните время начала', 'error'); return; }
  if (!end)   { showToast('Пожалуйста заполните время окончания', 'error'); return; }
  if (end <= start) { showToast('Время окончания должно быть позже начала', 'error'); return; }

  const sheetNum = activeTab === 'room' ? 1 : 2;
  const newStart = new Date(start);
  const newEnd = new Date(end);
  const conflict = allRecords.find(r => {
    if (r === editingRecord) return false;
    if (r['Sheet'] != sheetNum) return false;
    const rStart = new Date(r['Date & Start Time'] || r['Start Time']);
    const rEnd = new Date(r['Date & End Time'] || r['End Time']);
    if (isNaN(rStart) || isNaN(rEnd)) return false;
    return newStart < rEnd && newEnd > rStart;
  });
  if (conflict) {
    const who = conflict['Staff Name'] || '—';
    const from = fmt(conflict['Date & Start Time'] || conflict['Start Time']);
    const to = fmt(conflict['Date & End Time'] || conflict['End Time']);
    showToast(`Занято: ${who} (${from} – ${to})`, 'error');
    return;
  }

  const btn = document.getElementById('modal-add-btn');
  const lbl = document.getElementById('btn-label');
  btn.disabled = true; lbl.textContent = 'Сохранение...';

  if (editingRecord) {
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update', row: editingRecord['Row'], name, start, end })
      });
      editingRecord['Staff Name'] = name;
      editingRecord['Date & Start Time'] = start;
      editingRecord['Date & End Time'] = end;
      renderTable(activeTab);
      closeModal();
      showToast('Запись обновлена ✓', 'success');
    } catch {
      showToast('Не удалось обновить. Попробуйте позже.', 'error');
    }
    btn.disabled = false; lbl.textContent = 'Сохранить';
    return;
  }

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sheet: sheetNum, name, start, end })
    });
    allRecords.push({ 'Sheet': sheetNum, 'Staff Name': name, 'Date & Start Time': start, 'Date & End Time': end, 'Timestamp': new Date().toLocaleString() });
    renderTable(activeTab);
    closeModal();
    showToast('Запись сохранена ✓', 'success');
    setTimeout(loadRecords, 2500);
  } catch {
    showToast('Не удалось сохранить. Попробуйте позже.', 'error');
  }
  btn.disabled = false; lbl.textContent = 'Add Record';
}

function copyZoomLink(btn) {
  const url = 'https://zoom.us/j/96996928391?pwd=smWyeDrhT0UW7sVd1jLe5wYYtFzSeq.1';
  navigator.clipboard.writeText(url).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Скопировано`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Zoom ссылка`;
    }, 2000);
  });
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function editRecord(index, type) {
  const rows = allRecords.filter(r => r['Sheet'] == (type === 'room' ? 1 : 2));
  const r = rows[index];
  if (!r) return;
  const colors = { room: '#4472C4', zoom: '#548235' };
  activeTab = type;
  document.getElementById('modal-dot').style.background = colors[type];
  document.getElementById('modal-title').textContent = type === 'room' ? 'Изменить бронь комнаты' : 'Изменить Zoom-звонок';
  document.getElementById('modal-add-btn').style.background = colors[type];
  editingRecord = r;
  document.getElementById('f-name').value = r['Staff Name'] || '';
  document.getElementById('f-start').value = toDatetimeLocal(r['Date & Start Time'] || r['Start Time']);
  document.getElementById('f-end').value = toDatetimeLocal(r['Date & End Time'] || r['End Time']);
  document.getElementById('btn-label').textContent = 'Сохранить';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

async function removeRecord(index, type) {
  const rows = allRecords.filter(r => r['Sheet'] == (type === 'room' ? 1 : 2));
  const r = rows[index];
  if (!r) return;
  if (!confirm(`Удалить запись "${r['Staff Name'] || '—'}"?`)) return;
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', row: r['Row'] })
    });
    allRecords.splice(allRecords.indexOf(r), 1);
    renderTable(type);
    showToast('Запись удалена ✓', 'success');
  } catch {
    showToast('Не удалось удалить. Попробуйте позже.', 'error');
  }
}

document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modal').classList.contains('open')) addRecord();
});

loadRecords();
</script>
</body>
</html>
